<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Card</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="card">
      <div class="imgsec">
        <img
          class="poster"
          src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_660/FOOD_CATALOG/IMAGES/CMS/2025/4/28/10a9d1fa-14bf-495b-a88c-7661d366593c_472cd569-89d2-4a8b-a7f6-647e74472e64.jpg"
          alt=""
        />
      </div>
      <div class="desc">
        <div>
          <h2 class="recepie">Donne Biryani</h2>
          <img
            class="star"
            src="https://images.icon-icons.com/77/PNG/128/button_blank_green_14986.png "
            alt=""
          />
          <span class="ratingnumber">4.5 30-40 mins</span>
        </div>
        <div class="foodinfo">
          Andhra, South Indian, Biryani, Beverages, Desserts Indiranagar
        </div>
      </div>
    </div>
  </body>
</html>
