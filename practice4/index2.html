<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul li {
        display: inline;
        border-left: 2px solid;
        padding-left: 2px;
      }
      ul li:last-child {
        border-right: 2px solid;
        padding-right: 2px;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>Home</li>
      <li>Clothes</li>
      <li>Mobile</li>
      <li>Beauty</li>
      <li>Contact</li>
    </ul>
  </body>
</html>
