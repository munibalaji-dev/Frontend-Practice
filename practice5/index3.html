<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        display: inline-block;
        border: 2px dotted blue;
        text-align: center;
      }

      .box {
        display: inline-block;
        height: 200px;
        width: 200px;
        background-color: red;
      }

      #two {
        background-color: green;
        position: absolute;
        top: 20px;
        left: 30px;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box" id="one">First</div>
      <div class="box" id="two">Second</div>
      <div class="box" id="three">Third</div>
      <div class="box" id="four">Fourth</div>
    </div>
  </body>
</html>
