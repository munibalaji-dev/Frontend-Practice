<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
      .container {
        display: flex;
        text-align: center;
        gap: 10px;
        background-color: grey;
      }

      .one {
        height: 150px;
        width: 150px;
        background-color: red;
        margin: 10px;
      }
      .two {
        height: 150px;
        width: 150px;
        background-color: green;
        margin: 10px;
      }

      .three {
        height: 150px;
        width: 150px;
        background-color: blue;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="one">First Division</div>
      <div class="two">Second Division</div>
      <div class="three">Third Division</div>
    </div>
  </body>
</html>
